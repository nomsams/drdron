<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0c1324" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>flyjs — drone scaffold</title>
    <meta
      name="description"
      content="Lightweight flyable drone + procedural island scaffold with scalable graphics tiers."
    />
    <style>
      /* Instant first paint: shown before JS/CSS bundles load, removed on mount. */
      html, body { margin: 0; background: #0c1324; color: #e8eaf6; }
      #boot {
        position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 10px;
        font-family: system-ui, sans-serif; z-index: 100; padding: 20px;
      }
      #boot .spin {
        width: 34px; height: 34px; border-radius: 50%;
        border: 3px solid rgba(192,193,255,0.25); border-top-color: #c0c1ff;
        animation: bootspin 0.9s linear infinite;
      }
      @keyframes bootspin { to { transform: rotate(360deg); } }
      #boot p { margin: 0; font-size: 14px; opacity: 0.7; }
      #boot-log {
        margin: 6px 0 0; padding: 8px 10px; max-width: 560px; width: min(92vw, 560px);
        max-height: 32vh; overflow-y: auto; text-align: left;
        font-family: ui-monospace, monospace; font-size: 11px; line-height: 1.5;
        background: rgba(0,0,0,0.45); border: 1px solid rgba(255,255,255,0.12);
        border-radius: 8px; white-space: pre-wrap; word-break: break-word;
      }
      #boot-log .err { color: #ff9a9a; }
      #boot-log .warn { color: #ffd166; }
    </style>
  </head>
  <body>
    <div id="boot">
      <div class="spin"></div>
      <p id="boot-status">loading flyjs…</p>
      <pre id="boot-log"></pre>
    </div>
    <div id="root"></div>
    <script>
      // Pre-module boot hook: installs the splash log BEFORE any bundle runs,
      // so even a total module-graph crash leaves a visible trace.
      (function () {
        var logEl = document.getElementById("boot-log");
        var statusEl = document.getElementById("boot-status");
        function ts() {
          var d = new Date();
          return d.toTimeString().slice(0, 8) + "." + String(d.getMilliseconds()).padStart(3, "0");
        }
        function line(msg, cls) {
          try {
            if (!logEl) return;
            var div = document.createElement("div");
            if (cls) div.className = cls;
            div.textContent = ts() + " " + msg;
            logEl.appendChild(div);
            while (logEl.children.length > 300) logEl.removeChild(logEl.firstChild);
            logEl.scrollTop = logEl.scrollHeight;
          } catch (e) { /* never break boot for the log */ }
          try {
            if (cls === "err") console.error("[flyjs/boot] " + msg);
            else console.log("[flyjs/boot] " + msg);
          } catch (e) {}
        }
        window.__flyjsLog = function (msg) { line(String(msg)); };
        window.__flyjsBootStatus = function (s) { if (statusEl) statusEl.textContent = s; };
        window.__flyjsBootDone = function () {
          var b = document.getElementById("boot");
          if (b && b.parentNode) b.parentNode.removeChild(b);
        };
        line("html parsed · " + navigator.userAgent);
        line("url: " + location.href);
        if (location.protocol === "file:") {
          line("ERROR: opened via file:// — ES modules are blocked by the browser. Run `npm run dev` (or `npm run preview` after build) and open the http:// URL it prints.", "err");
        }
        try {
          var gl =
            document.createElement("canvas").getContext("webgl2") ||
            document.createElement("canvas").getContext("webgl");
          line(gl ? "webgl available" : "WARN: webgl context is null — the 3D view will fail (ErrorBoundary will show it)", gl ? "" : "warn");
        } catch (e) {
          line("WARN: webgl check threw: " + (e && e.message), "warn");
        }
        window.addEventListener(
          "error",
          function (e) {
            // Resource errors (failed chunk <script>) arrive here with target set.
            var t = e.target;
            if (t && t !== window && (t.src || t.href)) {
              line("ERROR: failed to load resource: " + (t.src || t.href) + " — dev server down? adblocker? offline?", "err");
              return;
            }
            line("ERROR: " + (e.message || "unknown error") + " @ " + (e.filename || "?") + ":" + (e.lineno || "?"), "err");
          },
          true
        );
        window.addEventListener("unhandledrejection", function (e) {
          var r = e.reason;
          var msg = r && (r.stack || r.message) ? r.stack || r.message : String(r);
          line("ERROR: unhandled rejection: " + msg, "err");
        });
        setTimeout(function () {
          if (document.getElementById("boot")) {
            line("STILL LOADING after 20s — checklist: 1) is `npm run dev` still running? 2) F12 console for red errors 3) try ?quality=potato 4) disable adblock for localhost", "err");
          }
        }, 20000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
